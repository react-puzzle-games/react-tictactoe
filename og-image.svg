<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="58" height="58" x="1" y="1" rx="4" fill="#f59e0b" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Tic-tac-toe board -->
  <g transform="translate(100, 165)">
    <!-- Grid lines -->
    <rect x="95" y="0" width="8" height="300" rx="4" fill="#f59e0b" opacity="0.6"/>
    <rect x="195" y="0" width="8" height="300" rx="4" fill="#f59e0b" opacity="0.6"/>
    <rect x="0" y="95" width="300" height="8" rx="4" fill="#f59e0b" opacity="0.6"/>
    <rect x="0" y="195" width="300" height="8" rx="4" fill="#f59e0b" opacity="0.6"/>

    <!-- X in top-left -->
    <g transform="translate(47, 47)">
      <rect x="-4" y="15" width="8" height="50" rx="4" fill="#60a5fa" transform="rotate(-45 0 0)"/>
      <rect x="-4" y="15" width="8" height="50" rx="4" fill="#60a5fa" transform="rotate(45 0 0)"/>
    </g>

    <!-- O in top-middle -->
    <circle cx="150" cy="47" r="30" fill="none" stroke="#f87171" stroke-width="8"/>

    <!-- X in middle -->
    <g transform="translate(147, 147)">
      <rect x="-4" y="15" width="8" height="50" rx="4" fill="#60a5fa" transform="rotate(-45 0 0)"/>
      <rect x="-4" y="15" width="8" height="50" rx="4" fill="#60a5fa" transform="rotate(45 0 0)"/>
    </g>

    <!-- O in bottom-left -->
    <circle cx="47" cy="250" r="30" fill="none" stroke="#f87171" stroke-width="8"/>

    <!-- X in bottom-right -->
    <g transform="translate(250, 250)">
      <rect x="-4" y="15" width="8" height="50" rx="4" fill="#60a5fa" transform="rotate(-45 0 0)"/>
      <rect x="-4" y="15" width="8" height="50" rx="4" fill="#60a5fa" transform="rotate(45 0 0)"/>
    </g>
  </g>

  <!-- Title -->
  <text x="750" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#fff" text-anchor="middle">Tic-Tac-Toe</text>

  <!-- Subtitle -->
  <text x="750" y="350" font-family="Arial, sans-serif" font-size="28" fill="#9ca3af" text-anchor="middle">Classic game built with React</text>

  <!-- URL -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="24" fill="#f59e0b" text-anchor="middle">tictactoe-game.ovidiu.dev</text>
</svg>
