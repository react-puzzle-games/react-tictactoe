<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#1a1a2e"/>

  <!-- Grid lines -->
  <rect x="10" y="4" width="2" height="24" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="20" y="4" width="2" height="24" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="4" y="10" width="24" height="2" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="4" y="20" width="24" height="2" rx="1" fill="#f59e0b" opacity="0.6"/>

  <!-- X mark (top-left) -->
  <g transform="translate(7, 7)">
    <rect x="-1" y="2" width="2" height="8" rx="1" fill="#60a5fa" transform="rotate(-45 3 3)"/>
    <rect x="-1" y="2" width="2" height="8" rx="1" fill="#60a5fa" transform="rotate(45 3 3)"/>
  </g>

  <!-- O mark (bottom-right) -->
  <circle cx="25" cy="25" r="3.5" fill="none" stroke="#f87171" stroke-width="2"/>
</svg>
